<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · UrbanCanopy</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🌳</text></svg>">
    <link rel="stylesheet" href="/css/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/app.css">

    <script>
        try {
            const stored = localStorage.getItem('uc.theme');
            if (stored === 'dark' || stored === 'light') {
                document.documentElement.setAttribute('data-theme', stored);
            }
        } catch (ignored) { /* private mode */ }
    </script>
</head>
<body>
<a class="uc-skip" href="#content">Skip to content</a>

<header class="uc-topbar">
    <a class="uc-brand" href="/">
        <span class="uc-brand-mark" aria-hidden="true">🌳</span>
        <span>UrbanCanopy</span>
    </a>
    <div class="uc-topbar-spacer"></div>
    <a class="uc-btn uc-btn--sm" href="/species.html">Species catalogue</a>
</header>

<main id="content" class="uc-authmain"></main>
<script type="module" src="/js/pages/login.js"></script>
</body>
</html>
